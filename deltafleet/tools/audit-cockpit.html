<html lang="en">
<head>

<title>Audit Cockpit — Delta Fleet Internal</title>

<style>
:root{
  --void:#05070f; --deep:#080d1c; --raised:#0b1226;
  --line:rgba(122,162,255,.14); --line-strong:rgba(122,162,255,.28);
  --ion:#4fd8ff; --coral:#ff6a3d; --nebula:#8b7bff; --gold:#ffc24b; --emerald:#34e3a4; --crimson:#ff4d6b;
  --text:#eaf0ff; --muted:#94a3c7; --faint:#5d6b8f;
  --sans:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --disp:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular','Cascadia Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:rgba(79,216,255,.28)}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;letter-spacing:-.01em}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--void)}::-webkit-scrollbar-thumb{background:#1b2647;border-radius:6px}
.klabel{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono)}

.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 20px;height:58px;background:rgba(5,8,17,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:.98rem;letter-spacing:.04em}
.bar .logo svg{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(255,194,75,.5))}
.bar .logo small{font-family:var(--mono);font-weight:400;font-size:.56rem;letter-spacing:.26em;color:var(--gold);display:block}
.bar .spacer{flex:1}
.chip{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;padding:4px 10px;border:1px solid var(--line-strong);border-radius:100px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:.82rem;padding:9px 16px;border-radius:8px;border:1px solid var(--line-strong);background:rgba(79,216,255,.06);color:var(--text);transition:.2s}
.btn:hover{background:rgba(79,216,255,.13);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#5be0ff,#2ea8d4);color:#03202e;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#ffd27a,#ff9d3b);color:#2a1602;border-color:transparent}
.btn.danger:hover{border-color:var(--crimson);color:var(--crimson);background:rgba(255,77,107,.08)}
.btn.sm{padding:6px 11px;font-size:.74rem}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ion);outline-offset:1px}

.tabs{display:flex;gap:6px;padding:14px 20px 0;border-bottom:1px solid var(--line);background:var(--deep)}
.tab{background:none;border:1px solid transparent;border-bottom:none;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:.86rem;padding:10px 18px;border-radius:10px 10px 0 0}
.tab:hover{color:var(--text)}
.tab.on{background:var(--void);border-color:var(--line);color:var(--gold)}

.wrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 108px)}
.side{border-right:1px solid var(--line);background:var(--deep);padding:16px 12px}
.side .klabel{padding:4px 8px 8px;display:block}
.client-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);font-size:.88rem;font-weight:500;margin-bottom:4px}
.client-item:hover{background:rgba(122,162,255,.06);color:var(--text)}
.client-item.on{background:rgba(255,194,75,.08);border-color:rgba(255,194,75,.35);color:var(--text)}
.client-item i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold);flex:none}
.client-item .n{font-family:var(--mono);font-size:.58rem;color:var(--faint);margin-left:auto}
.main{padding:22px 24px 60px;max-width:1280px}
.main.full{grid-column:1/-1;max-width:1280px;margin:0 auto;width:100%}

.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:1.02rem}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
input,select{background:var(--deep);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;color:var(--text);font-family:var(--sans);font-size:.9rem;width:100%}
input[type=number]{font-family:var(--mono);font-size:.85rem}
input:focus,select:focus{border-color:var(--ion)}
input[type=range]{padding:0;height:5px;-webkit-appearance:none;appearance:none;border:none;border-radius:100px;background:linear-gradient(90deg,var(--gold) var(--fill,50%),#1a2547 var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#eaf6ff;border:3px solid var(--gold);cursor:grab}

/* confidence tag */
.conf{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden}
.conf button{background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:.54rem;letter-spacing:.08em;padding:3px 8px}
.conf button.on{background:rgba(79,216,255,.14);color:var(--ion)}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line-strong)}
td{padding:8px 9px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}
td input,td select{padding:6px 8px;font-size:.84rem}
td:first-child{color:var(--text)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{color:var(--text);font-weight:600;border-top:1px solid var(--line-strong);border-bottom:none}

.verdict{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;padding:6px 14px;border-radius:100px;font-weight:700}
.verdict.go{background:rgba(52,227,164,.12);color:var(--emerald);border:1px solid rgba(52,227,164,.4)}
.verdict.review{background:rgba(255,194,75,.1);color:var(--gold);border:1px solid rgba(255,194,75,.4)}
.verdict.reshape{background:rgba(255,77,107,.1);color:var(--crimson);border:1px solid rgba(255,77,107,.4)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.kpi b{display:block;font-family:var(--disp);font-size:1.32rem;font-weight:700;color:var(--ion);font-variant-numeric:tabular-nums}
.kpi.warm b{color:var(--coral)}.kpi.good b{color:var(--emerald)}.kpi.gold b{color:var(--gold)}.kpi.vio b{color:var(--nebula)}
.kpi span{font-size:.7rem;color:var(--faint);display:block;line-height:1.3}
.kpi .sub{font-family:var(--mono);font-size:.58rem;color:var(--faint);margin-top:3px;display:block}
.bench{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--faint);margin-top:8px;line-height:1.7}

.chart{background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:14px}
.chart h5{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
.suit-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.suit-row label{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--muted);width:190px;text-transform:uppercase}
.suit-row output{font-family:var(--mono);font-size:.72rem;color:var(--gold);width:20px;text-align:right}
.corr-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.corr-tab{background:var(--raised);border:1px solid var(--line);color:var(--muted);border-radius:100px;padding:7px 15px;font-size:.8rem;font-weight:500}
.corr-tab.on{background:rgba(79,216,255,.12);border-color:var(--ion);color:var(--ion)}
.empty{border:1px dashed var(--line-strong);border-radius:14px;padding:60px 30px;text-align:center;color:var(--faint)}
.hint{font-size:.74rem;color:var(--faint);margin-top:6px;line-height:1.5}
.flag{font-family:var(--mono);font-size:.58rem;color:var(--crimson);letter-spacing:.08em}
.assume td{font-size:.84rem}

#blueprint{display:none}
@media print{
 body>*{display:none!important}
 body{background:#fff;color:#111}
 #blueprint{display:block!important;padding:8mm;font-size:11.5px;color:#16203a}
 #blueprint h1{font-size:19px;margin-bottom:2px}
 #blueprint h2{font-size:12.5px;margin:12px 0 5px;border-bottom:1.5px solid #16203a;padding-bottom:3px}
 #blueprint .bklabel{font-size:8.5px;letter-spacing:.18em;color:#556}
 #blueprint table{width:100%;border-collapse:collapse;font-size:10.5px;margin:5px 0}
 #blueprint th{text-align:left;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#445;border-bottom:1px solid #99a;padding:3px 6px}
 #blueprint td{padding:3px 6px;border-bottom:.5px solid #ccd;color:#223}
 #blueprint .big{font-size:20px;font-weight:700}
 #blueprint .bp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:7px 0}
 #blueprint .bp-cell{border:1px solid #99a;border-radius:6px;padding:7px}
 #blueprint .fine{font-size:8.5px;color:#667;margin-top:12px;border-top:1px solid #99a;padding-top:5px;line-height:1.5}
}
@media(max-width:980px){.wrap{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line)}.grid2,.grid3,.grid4{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
'use strict';
/* ============ AUDIT COCKPIT v2 ============
   CFO-grade corridor business cases. Upgrades from research brief:
   coverage-adjusted automatable hours; redeployment factor (hard vs soft);
   rate-based error avoidance; ramped 36-month cash model; NPV @ hurdle,
   IRR (bisection); breakeven multiplier; Monte-Carlo-lite P10/P50/P90 via
   confidence-tagged triangular sampling; suitability gate; CD3 portfolio
   ranking; assumptions register; measurement plan in the blueprint. */
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];
const fmt$=n=>(n<0?'−$':'$')+Math.round(Math.abs(n)).toLocaleString();
const pct=n=>(n*100).toFixed(0)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const KEY='df-audit-v2';

/* ---- assumptions (editable, shown in register) ---- */
const DEF={
 hurdle:14,            // % annual discount rate (SMB ops convention: 12–15)
 errCredit:60,         // % of modelled error avoidance credited
 liftCredit:50,        // % of revenue lift credited (soft)
 rampMonths:[25,50,75],// % of run-rate in first months after go-live
 horizon:36,           // months modelled
 internalPct:6,        // client team time as % of build fee
 conf:{M:.12,E:.28,G:.5} // triangular half-spread by confidence tag
};
const COVERAGE={structured:60,semi:40,judgment:25};
const REDEPLOY=[['headcount','Headcount avoided / overtime cut',1],['named','Capacity redeployed to named use',.7],['none','No redeployment plan yet',.5]];
const SUIT_FACTORS=[
 ['volume','Volume & repetition',20,false],['rules','Rule clarity',20,false],['structure','Input structure / data quality',20,false],
 ['stability','System & process stability',15,false],['exceptions','Exception rate (5 = rare)',15,false],['compliance','Compliance sensitivity (5 = low)',10,false]];

let DB={settings:{hurdle:DEF.hurdle},clients:[]}, sel={client:null,corr:null}, view='clients', memOnly=false;
function load(){try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r)}catch(e){memOnly=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));flash('LOCAL · SAVED')}catch(e){memOnly=true;flash('MEMORY ONLY')}}
function flash(t){const el=$('#save-state');el.textContent=t;el.style.color='var(--emerald)';setTimeout(()=>el.style.color='',900)}
const uid=()=>Math.random().toString(36).slice(2,9);

function blankCorr(name){return{id:uid(),name:name||'New corridor',systems:'',
 roles:[{title:'Ops analyst',rate:38,hrs:12}],
 procType:'structured',coverage:COVERAGE.structured,residual:15,redeploy:'named',
 volumeWk:300,errRate:2,errResid:0.3,errCost:120,oppAnnual:18000,turnDays:4,
 agents:10,ints:3,build:18000,buildWks:4,platformMo:0,retainerOverride:0,
 conf:{hours:'E',coverage:'E',err:'G',lift:'G'},
 suit:{volume:4,rules:4,structure:3,stability:4,exceptions:3,compliance:4}}}
function migrate(c){const b=blankCorr();for(const k in b)if(c[k]===undefined)c[k]=b[k];
 if(c.errInc!==undefined&&c.errCost<1000){/* v1 data: keep as-is */}
 return c}

/* ---- model ---- */
function retainerFor(c){if(+c.retainerOverride>0)return +c.retainerOverride;
 let p=350+c.agents*95+c.volumeWk*.35+c.ints*40;return Math.max(500,Math.min(3400,Math.round(p/50)*50))}
function tierFor(r,a){return(a<=3&&r<950)?'Scout':(r<1900?'Squadron':'Armada')}
function suitScore(c){let s=0,max=0;SUIT_FACTORS.forEach(([k,_,w])=>{s+=(c.suit[k]||3)*w;max+=5*w});return Math.round(s/max*100)}

/* core annual benefits given multipliers m={h,cov,err,lift} */
function benefits(c,m={h:1,cov:1,err:1,lift:1}){
 const wage=c.roles.reduce((s,r)=>s+r.rate*r.hrs,0)*52*m.h;
 const autoHrsFactor=Math.min(.95,(c.coverage/100)*m.cov)*(1-c.residual/100);
 const automatable=wage*autoHrsFactor;
 const rd=REDEPLOY.find(x=>x[0]===c.redeploy)[2];
 const hard=automatable*rd;
 const soft=automatable*(1-rd);
 const errBase=c.volumeWk*52*(c.errRate/100)*m.err*c.errCost;
 const errAvoid=errBase*(1-Math.min(1,c.errResid/Math.max(.01,c.errRate)))*(DEF.errCredit/100);
 const lift=(+c.oppAnnual||0)*m.lift*(DEF.liftCredit/100);
 return{wage,automatable,hard,soft,errAvoid,lift,
  hardTotal:hard+errAvoid,total:hard+errAvoid+lift+soft*0}; // soft capacity shown, not counted
}
/* 36-month cash array */
function cashflow(c,ben){
 const ret=retainerFor(c), goLive=Math.max(1,Math.ceil(c.buildWks/4.33));
 const internal=c.build*(DEF.internalPct/100);
 const mB=ben.total/12, cash=[];
 for(let m=0;m<DEF.horizon;m++){
  let cf=0;
  if(m===0)cf-=c.build+internal;
  if(m>=goLive){
   const k=m-goLive, ramp=k<DEF.rampMonths.length?DEF.rampMonths[k]/100:1;
   cf+=mB*ramp-ret-(+c.platformMo||0);
  }
  cash.push(cf);
 }
 return{cash,ret,goLive,internal};
}
function paybackOf(cash){let cum=0;for(let m=0;m<cash.length;m++){cum+=cash[m];if(cum>=0)return m+1}return null}
function npvOf(cash,annualR){const r=Math.pow(1+annualR,1/12)-1;return cash.reduce((a,cf,m)=>a+cf/Math.pow(1+r,m),0)}
function irrOf(cash){ // annualized, bisection on monthly rate
 let lo=-0.9,hi=2;const f=r=>cash.reduce((a,cf,m)=>a+cf/Math.pow(1+r,m),0);
 if(f(lo)*f(hi)>0)return null;
 for(let i=0;i<70;i++){const mid=(lo+hi)/2;(f(lo)*f(mid)<=0)?hi=mid:lo=mid}
 return Math.pow(1+(lo+hi)/2,12)-1;
}
/* triangular sample around v with half-spread s */
function tri(v,s){const o=v*(1-s),p=v*(1+s),m=v,u=Math.random(),c=(m-o)/(p-o);
 return u<c?o+Math.sqrt(u*(p-o)*(m-o)):p-Math.sqrt((1-u)*(p-o)*(p-m))}
function calc(c){
 const hurdle=(DB.settings.hurdle??DEF.hurdle)/100;
 const ben=benefits(c);
 const{cash,ret,goLive,internal}=cashflow(c,ben);
 const payback=paybackOf(cash);
 const npv=npvOf(cash,hurdle), irr=irrOf(cash);
 const benHardOnly=Object.assign({},ben,{total:ben.hardTotal});
 const npvHard=npvOf(cashflow(c,benHardOnly).cash,hurdle);
 /* breakeven multiplier: min f where payback(f·benefits) ≤ 12 */
 let lo=0.02,hi=1.6,be=null;
 const pbAt=f=>{const b2=Object.assign({},ben,{total:ben.total*f});return paybackOf(cashflow(c,b2).cash)};
 if(pbAt(hi)!==null&&pbAt(hi)<=12){for(let i=0;i<40;i++){const mid=(lo+hi)/2;const p=pbAt(mid);(p!==null&&p<=12)?hi=mid:lo=mid}be=hi}
 /* monte-carlo lite */
 const S=DEF.conf, N=800, npvs=[], pbs=[];
 for(let i=0;i<N;i++){
  const m={h:tri(1,S[c.conf.hours]),cov:tri(1,S[c.conf.coverage]),err:tri(1,S[c.conf.err]),lift:tri(1,S[c.conf.lift])};
  const b=benefits(c,m);
  const cf=cashflow(c,b).cash;
  npvs.push(npvOf(cf,hurdle));
  const p=paybackOf(cf);pbs.push(p===null?99:p);
 }
 npvs.sort((a,b)=>a-b);pbs.sort((a,b)=>a-b);
 const q=(arr,p)=>arr[Math.floor(p*arr.length)];
 const mc={npv10:q(npvs,.1),npv50:q(npvs,.5),npv90:q(npvs,.9),
  pb10:q(pbs,.1),pb50:q(pbs,.5),pb90:q(pbs,.9),
  pPos:npvs.filter(v=>v>0).length/N,p12:pbs.filter(v=>v<=12).length/N};
 /* tornado: NPV swing per input at its tag spread */
 const tor=['hours','coverage','err','lift'].map(k=>{
  const s=S[c.conf[k]],key={hours:'h',coverage:'cov',err:'err',lift:'lift'}[k];
  const mk=v=>{const m={h:1,cov:1,err:1,lift:1};m[key]=v;return npvOf(cashflow(c,benefits(c,m)).cash,hurdle)};
  return{k,lo:mk(1-s),hi:mk(1+s)}}).sort((a,b)=>Math.abs(b.hi-b.lo)-Math.abs(a.hi-a.lo));
 const suit=suitScore(c);
 /* verdict: gated by suitability, judged on the band */
 let verdict='reshape';
 if(suit>=55){
  if(mc.pb50<=12&&mc.pb90<=18&&npv>0)verdict='go';
  else if(mc.pb50<=18&&npv>0)verdict='review';
 }
 const annualNet=ben.total-ret*12-(+c.platformMo||0)*12;
 const cd3=(annualNet/52)/Math.max(1,c.buildWks);
 return{ben,cash,ret,goLive,internal,payback,npv,irr,npvHard,be,mc,tor,suit,verdict,cd3,
  delayWk:Math.max(0,annualNet/52),tier:tierFor(ret,c.agents),hurdle};
}

/* ---- views ---- */
function render(){
 $$('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view));
 const full=view!=='clients';
 $('#side').style.display=full?'none':'';
 $('#main').classList.toggle('full',full);
 renderSide();
 const m=$('#main');
 if(view==='portfolio')m.innerHTML=portfolioHTML();
 else if(view==='assumptions'){m.innerHTML=assumeHTML();wireAssume()}
 else renderClients(m);
}
function renderSide(){
 const el=$('#client-list');

 $$('.client-item',el).forEach(b=>b.onclick=()=>{sel.client=b.dataset.id;sel.corr=null;view='clients';render()});
}
const client=()=>DB.clients.find(c=>c.id===sel.client);
function corr(){const cl=client();if(!cl)return null;const k=cl.corridors.find(x=>x.id===sel.corr)||cl.corridors[0];return k?migrate(k):null}

  <button class="btn sm" onclick="renameClient()">Rename</button><button class="btn sm danger" onclick="delClient()">Delete Client</button></div>

function cumChart(r,c){
 let cum=0;const pts=r.cash.slice(0,24).map(cf=>(cum+=cf));
 const max=Math.max(...pts.map(Math.abs),1);
 const bars=pts.map((v,i)=>{const h=Math.max(2,Math.abs(v)/max*66),y=v>=0?72-h:74;
  return `<rect x="${12+i*16.2}" y="${y}" width="11" height="${h}" rx="2" fill="${v>=0?'#34e3a4':'#ff6a3d'}" opacity=".9"/>`}).join('');
 const lbl=[0,5,11,17,23].map(i=>`<text x="${17+i*16.2}" y="95" font-size="7" fill="#5d6b8f" text-anchor="middle" font-family="monospace">M${i+1}</text>`).join('');
 return `<svg viewBox="0 0 410 100" style="width:100%"><line x1="8" y1="73" x2="402" y2="73" stroke="#22314f"/>${bars}${lbl}</svg>`;
}
function tornadoChart(r){
 const names={hours:'HOURS / WK',coverage:'COVERAGE %',err:'ERROR RATE',lift:'REVENUE LIFT'};
 const all=r.tor.flatMap(t=>[t.lo,t.hi]);const min=Math.min(...all,0),max=Math.max(...all,1);
 const X=v=>20+(v-min)/(max-min)*360;
 const rows=r.tor.map((t,i)=>{const y=16+i*24;
  return `<text x="18" y="${y+4}" font-size="7.5" fill="#94a3c7" text-anchor="end" font-family="monospace" transform="translate(58,0)">${names[t.k]}</text>
  <rect x="${Math.min(X(t.lo),X(t.hi))+62}" y="${y-6}" width="${Math.abs(X(t.hi)-X(t.lo))}" height="12" rx="3" fill="${i===0?'#ffc24b':'#4fd8ff'}" opacity="${.95-i*.15}"/>`}).join('');
 return `<svg viewBox="0 0 460 112" style="width:100%"><line x1="${X(0)+62}" y1="6" x2="${X(0)+62}" y2="100" stroke="#22314f" stroke-dasharray="3 3"/>${rows}
 <text x="${X(0)+62}" y="110" font-size="7" fill="#5d6b8f" text-anchor="middle" font-family="monospace">NPV $0</text></svg>`;
}

/* ---- portfolio (CD3) ---- */
function portfolioHTML(){
 const rows=[];
 DB.clients.forEach(cl=>cl.corridors.forEach(k=>{migrate(k);const r=calc(k);
  rows.push({cl:cl.name,k:k.name,cd3:r.cd3,delay:r.delayWk,pb:r.mc.pb50,npv:r.npv,suit:r.suit,verdict:r.verdict,wks:k.buildWks})}));
 rows.sort((a,b)=>b.cd3-a.cd3);
 if(!rows.length)return '<div class="empty"><h3>Nothing to rank</h3><p>Add corridors, then this view answers: which build first?</p></div>';
 return `<div class="panel"><div class="phead"><h3>Portfolio · ranked by CD3 (cost of delay ÷ build duration)</h3><span class="chip">${rows.length} CORRIDORS</span></div>
 <p class="hint" style="margin-bottom:12px">Reinertsen/WSJF flow economics: build the corridor that costs the most per week of waiting per week of build. This reframes "is it worth it?" into "which one first?" — and every week of deliberation has a price.</p>
 <table><thead><tr><th>#</th><th>Client</th><th>Corridor</th><th class="r">Delay cost /wk</th><th class="r">Build wks</th><th class="r">CD3</th><th class="r">Payback P50</th><th class="r">NPV 3yr</th><th class="r">Suit.</th><th>Verdict</th></tr></thead>
 <tbody>${rows.map((r,i)=>`<tr><td class="mono" style="color:var(--gold)">${String(i+1).padStart(2,'0')}</td><td>${esc(r.cl)}</td><td>${esc(r.k)}</td>
  <td class="r">${fmt$(r.delay)}</td><td class="r">${r.wks}</td><td class="r" style="color:var(--gold);font-weight:600">${fmt$(r.cd3)}</td>
  <td class="r">${r.pb<=36?('M'+r.pb):'—'}</td><td class="r" style="color:${r.npv>0?'var(--emerald)':'var(--coral)'}">${fmt$(r.npv)}</td>
  <td class="r">${r.suit}</td><td><span class="verdict ${r.verdict}" style="font-size:.54rem;padding:3px 9px">${r.verdict.toUpperCase()}</span></td></tr>`).join('')}</tbody></table></div>`;
}

 <tr><td>Revenue-lift credit</td><td>${DEF.liftCredit}% · soft</td><td>CFOs credit speculative revenue at 0–50%; excluded from hard-only NPV. If the case needs it, that's a REVIEW signal.</td></tr>
 <tr><td>Ramp profile</td><td>${DEF.rampMonths.join(' / ')} / 100%</td><td>Month-1-at-full-run-rate is the gap skeptical CFOs find. Ramp starts at go-live.</td></tr>

  procType:'judgment',coverage:25,residual:25,redeploy:'named',
  volumeWk:90,errRate:1,errResid:.2,errCost:400,oppAnnual:24000,turnDays:12,agents:6,ints:2,build:15000,buildWks:6,
  conf:{hours:'E',coverage:'G',err:'G',lift:'G'},suit:{volume:3,rules:3,structure:2,stability:4,exceptions:2,compliance:3}});
 DB.clients.push({id:uid(),name:'Meridian Software',industry:'B2B SaaS · Series B',corridors:[m,d]},
  {id:uid(),name:'Harbourline Group',industry:'Professional services',corridors:[h]});
 sel.client=DB.clients[DB.clients.length-2].id;sel.corr=null;view='clients';save();render()};

$('#btn-export').onclick=()=>{const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='df-audits-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
$('#btn-import').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
 f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.clients))throw 0;if(!d.settings)d.settings={hurdle:DEF.hurdle};
  DB=d;sel={client:DB.clients[0]?.id||null,corr:null};save();render()}catch(err){alert('Not a valid Audit Cockpit export.')}})});
$('#btn-new-client').onclick=()=>newClient();
$('#btn-seed').onclick=()=>seed();
$$('#tabs .tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;render()});

/* ---- blueprint ---- */
window.printBlueprint=function(){
 const cl=client(),c=corr();if(!cl||!c)return;
 const r=calc(c);
 const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
 $('#blueprint').innerHTML=`
 <p class="bklabel">DELTA FLEET · FLEET BLUEPRINT · ${today}</p>
 <h1>${esc(cl.name)} — ${esc(c.name)}</h1>
 <p>${esc(cl.industry||'')}${c.systems?' · Systems: '+esc(c.systems):''} · Suitability ${r.suit}/100 · Verdict: ${r.verdict.toUpperCase()}</p>
 <div class="bp-grid">
  <div class="bp-cell"><div class="bklabel">PAYBACK (P50 / P90)</div><div class="big">M${r.mc.pb50}<span style="font-size:11px"> / M${r.mc.pb90<=36?r.mc.pb90:'36+'}</span></div></div>
  <div class="bp-cell"><div class="bklabel">NPV 3YR @ ${(r.hurdle*100).toFixed(0)}%</div><div class="big">${fmt$(r.npv)}</div></div>
  <div class="bp-cell"><div class="bklabel">IRR</div><div class="big">${r.irr!==null?pct(r.irr):'—'}</div></div>
  <div class="bp-cell"><div class="bklabel">SURVIVES AT</div><div class="big">${r.be?pct(r.be):'—'}</div></div>
 </div>
 <h2>Measured baseline</h2>
 <table><thead><tr><th>Role</th><th>Loaded rate</th><th>Repetitive hrs/wk</th><th>Annual cost</th></tr></thead><tbody>
 ${c.roles.map(ro=>`<tr><td>${esc(ro.title)}</td><td>$${ro.rate}/hr</td><td>${ro.hrs}</td><td>${fmt$(ro.rate*ro.hrs*52)}</td></tr>`).join('')}</tbody></table>
 <p>Volume ≈ ${c.volumeWk}/wk · error rate ${c.errRate}% → ${c.errResid}% post-automation · turnaround ≈ ${c.turnDays} days · coverage ${c.coverage}% (${esc(c.procType)}), residual touch ${c.residual}%.</p>
 <h2>Year-1 → Year-3 model (credited, ramped)</h2>
 <table><tbody>
  <tr><td>Hard labour savings (coverage × redeployment)</td><td style="text-align:right">+${fmt$(r.ben.hard)}/yr</td></tr>
  <tr><td>Error avoidance (rate-based, ${DEF.errCredit}% credited)</td><td style="text-align:right">+${fmt$(r.ben.errAvoid)}/yr</td></tr>
  <tr><td>Revenue lift (soft, ${DEF.liftCredit}% credited — excluded from hard-only NPV of ${fmt$(r.npvHard)})</td><td style="text-align:right">+${fmt$(r.ben.lift)}/yr</td></tr>
  <tr><td>Freed capacity noted, not dollarised</td><td style="text-align:right">(${fmt$(r.ben.soft)}/yr)</td></tr>
  <tr><td>Build ${fmt$(c.build)} + client time ${fmt$(r.internal)} · go-live month ${r.goLive} · ramp ${DEF.rampMonths.join('/')}%</td><td style="text-align:right">month 0</td></tr>
  <tr><td>Retainer (${r.tier}) + platform — includes hosting, monitoring, break-fix</td><td style="text-align:right">−${fmt$(r.ret+(+c.platformMo||0))}/mo</td></tr>
  <tr><td><b>Probability NPV positive: ${pct(r.mc.pPos)} · payback ≤ 12mo: ${pct(r.mc.p12)} · cost of each week's delay: ${fmt$(r.delayWk)}</b></td><td></td></tr>
 </tbody></table>
 <h2>Measurement plan</h2>
 <table><tbody>
  <tr><td>Pre-build</td><td>Baseline lock: volume, handle time, error rate, turnaround — captured above, signed by both parties.</td></tr>
  <tr><td>Days 0–30</td><td>Shadow mode in the Swarm sandbox; accuracy tuned vs human baseline; nothing ships.</td></tr>
  <tr><td>Days 31–60</td><td>Gated autonomy; hours-reclaimed and exception-rate tracked in Agentloop against this blueprint.</td></tr>
  <tr><td>Day 90</td><td>Re-measure vs baseline; model reconciled line-by-line; gates relaxed on evidence.</td></tr>
 </tbody></table>
 <p class="fine">Assumptions: hurdle ${(r.hurdle*100).toFixed(0)}% · coverage benchmarks 60/40/25% by process type · redeployment factors 1.0/0.7/0.5 · keying error benchmark 1–4% · ramp ${DEF.rampMonths.join('/')}/100% · 36-month horizon · confidence spreads ±12/28/50% (Measured/Estimated/Guessed) with 800-iteration triangular simulation. Internal draft — verify baselines with the client before delivery.</p>`;
 window.print();
};

load();if(memOnly)flash('MEMORY ONLY');
sel.client=DB.clients[0]?.id||null;
render();
</script>
