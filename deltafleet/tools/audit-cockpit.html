<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Cockpit — Delta Fleet Internal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 27H3Z' fill='none' stroke='%23ffc24b' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root{
  --void:#05070f; --deep:#080d1c; --raised:#0b1226; --panel:#0e162e;
  --line:rgba(122,162,255,.14); --line-strong:rgba(122,162,255,.28);
  --ion:#4fd8ff; --coral:#ff6a3d; --nebula:#8b7bff; --gold:#ffc24b; --emerald:#34e3a4; --crimson:#ff4d6b;
  --text:#eaf0ff; --muted:#94a3c7; --faint:#5d6b8f;
  --sans:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --disp:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular','Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:rgba(79,216,255,.28)}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;letter-spacing:-.01em}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--void)}::-webkit-scrollbar-thumb{background:#1b2647;border-radius:6px}

.klabel{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono)}

/* ---- app bar ---- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;background:rgba(5,8,17,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:.98rem;letter-spacing:.04em}
.bar .logo svg{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(255,194,75,.5))}
.bar .logo small{font-family:var(--mono);font-weight:400;font-size:.56rem;letter-spacing:.26em;color:var(--gold);display:block}
.bar .spacer{flex:1}
.chip{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;padding:4px 10px;border:1px solid var(--line-strong);border-radius:100px;color:var(--muted)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:.82rem;padding:9px 16px;border-radius:8px;border:1px solid var(--line-strong);background:rgba(79,216,255,.06);color:var(--text);transition:.2s}
.btn:hover{background:rgba(79,216,255,.13);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#5be0ff,#2ea8d4);color:#03202e;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 18px rgba(79,216,255,.35)}
.btn.gold{background:linear-gradient(135deg,#ffd27a,#ff9d3b);color:#2a1602;border-color:transparent}
.btn.danger:hover{border-color:var(--crimson);color:var(--crimson);background:rgba(255,77,107,.08)}
.btn.sm{padding:6px 11px;font-size:.74rem}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ion);outline-offset:1px}

/* ---- layout ---- */
.wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);background:var(--deep);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.side .klabel{padding:4px 8px 8px}
.client-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);font-size:.88rem;font-weight:500}
.client-item:hover{background:rgba(122,162,255,.06);color:var(--text)}
.client-item.on{background:rgba(255,194,75,.08);border-color:rgba(255,194,75,.35);color:var(--text)}
.client-item i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold);flex:none}
.client-item .n{font-family:var(--mono);font-size:.58rem;color:var(--faint);margin-left:auto}
.main{padding:22px 26px 60px;max-width:1220px}

/* ---- panels ---- */
.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:1.02rem;display:flex;align-items:center;gap:10px}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input,select{background:var(--deep);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;color:var(--text);font-family:var(--sans);font-size:.9rem;width:100%}
input[type=number]{font-family:var(--mono);font-size:.85rem}
input:focus,select:focus{border-color:var(--ion)}
.inline{display:grid;gap:10px}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ion);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line-strong)}
td{padding:8px 9px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}
td input{padding:6px 8px;font-size:.84rem}
td:first-child{color:var(--text)}
.num,td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{color:var(--text);font-weight:600;border-top:1px solid var(--line-strong);border-bottom:none}

/* ---- results ---- */
.verdict{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;padding:6px 14px;border-radius:100px;font-weight:700}
.verdict.go{background:rgba(52,227,164,.12);color:var(--emerald);border:1px solid rgba(52,227,164,.4)}
.verdict.review{background:rgba(255,194,75,.1);color:var(--gold);border:1px solid rgba(255,194,75,.4)}
.verdict.reshape{background:rgba(255,77,107,.1);color:var(--crimson);border:1px solid rgba(255,77,107,.4)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.kpi b{display:block;font-family:var(--disp);font-size:1.45rem;font-weight:700;color:var(--ion);font-variant-numeric:tabular-nums}
.kpi.warm b{color:var(--coral)}.kpi.good b{color:var(--emerald)}.kpi.gold b{color:var(--gold)}
.kpi span{font-size:.72rem;color:var(--faint)}
.bench{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--faint);margin-top:8px}

/* ---- charts ---- */
.chart{background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:14px}
.chart h5{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:10px}

.empty{border:1px dashed var(--line-strong);border-radius:14px;padding:60px 30px;text-align:center;color:var(--faint)}
.empty h3{color:var(--muted);margin-bottom:8px}
.corr-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.corr-tab{background:var(--raised);border:1px solid var(--line);color:var(--muted);border-radius:100px;padding:7px 15px;font-size:.8rem;font-weight:500}
.corr-tab.on{background:rgba(79,216,255,.12);border-color:var(--ion);color:var(--ion)}
.hint{font-size:.76rem;color:var(--faint);margin-top:6px}
.footer-note{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--faint);text-align:center;padding:26px 0 10px}

/* ---- print blueprint ---- */
#blueprint{display:none}
@media print{
 body>*{display:none!important}
 body{background:#fff;color:#111}
 #blueprint{display:block!important;padding:10mm;font-size:12px;color:#16203a}
 #blueprint h1{font-size:20px;margin-bottom:2px}
 #blueprint h2{font-size:13px;margin:14px 0 6px;border-bottom:1.5px solid #16203a;padding-bottom:3px}
 #blueprint .bklabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:#5a6residual}
 #blueprint table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
 #blueprint th{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#445;border-bottom:1px solid #99a;padding:4px 6px}
 #blueprint td{padding:4px 6px;border-bottom:.5px solid #ccd;color:#223}
 #blueprint .big{font-size:22px;font-weight:700}
 #blueprint .bp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
 #blueprint .bp-cell{border:1px solid #99a;border-radius:6px;padding:8px}
 #blueprint .fine{font-size:9px;color:#667;margin-top:14px;border-top:1px solid #99a;padding-top:6px}
}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}.grid2,.grid3,.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="bar">
  <span class="logo">
    <svg viewBox="0 0 32 32" fill="none"><path d="M16 3 29 27H3Z" stroke="#ffc24b" stroke-width="2.4"/><path d="M16 11 22.5 23h-13Z" fill="#ffc24b" opacity=".85"/></svg>
    <span>AUDIT COCKPIT<small>DELTA FLEET · INTERNAL</small></span>
  </span>
  <span class="chip" id="save-state">LOCAL · SAVED</span>
  <span class="spacer"></span>
  <button class="btn sm" id="btn-seed">Load Demo Data</button>
  <button class="btn sm" id="btn-export">Export JSON</button>
  <label class="btn sm" style="position:relative;overflow:hidden">Import JSON<input type="file" id="btn-import" accept=".json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
  <button class="btn primary sm" id="btn-new-client">+ New Client</button>
</header>

<div class="wrap">
  <aside class="side">
    <p class="klabel">Clients</p>
    <div id="client-list"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="blueprint"></div>

<script>
'use strict';
/* ============ AUDIT COCKPIT ============
   Internal tool: capture a workflow-audit baseline per client corridor,
   compute the fleet ROI model (same arithmetic as the published framework:
   80% credit on reclaimed hours, 60% on error costs, 50% on revenue lift),
   price the squadron with the standard retainer formula, and print a
   client-ready blueprint. Data persists to localStorage. */
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];
const fmt$=n=>'$'+Math.round(n).toLocaleString();
const KEY='df-audit-v1';

let DB={clients:[]}, sel={client:null,corr:null}, memOnly=false;
function load(){try{const raw=localStorage.getItem(KEY);if(raw)DB=JSON.parse(raw)}catch(e){memOnly=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));flash('LOCAL · SAVED')}catch(e){memOnly=true;flash('MEMORY ONLY')}}
function flash(t){const el=$('#save-state');el.textContent=t;el.style.color='var(--emerald)';setTimeout(()=>el.style.color='',900)}
const uid=()=>Math.random().toString(36).slice(2,9);

function blankCorr(name){return{id:uid(),name:name||'New corridor',systems:'',
 roles:[{title:'Ops analyst',rate:38,hrs:12}],
 volumeWk:300,errInc:6,errCost:4000,oppAnnual:18000,turnDays:4,
 agents:10,ints:3,build:18000,retainerOverride:0}}

/* ---- ROI engine (mirrors the published framework + pricing formula) ---- */
function retainerFor(c){
 if(+c.retainerOverride>0)return +c.retainerOverride;
 let p=350+c.agents*95+c.volumeWk*.35+c.ints*40;
 return Math.max(500,Math.min(3400,Math.round(p/50)*50));
}
function tierFor(r,agents){return (agents<=3&&r<950)?'Scout':(r<1900?'Squadron':'Armada')}
function calc(c){
 const wage=c.roles.reduce((s,r)=>s+r.rate*r.hrs,0)*52;
 const hard=wage*.8;                       // 80% realism haircut
 const err=(c.errInc*c.errCost)*.6;        // 60% credit
 const opp=(+c.oppAnnual||0)*.5;           // 50% discount
 const benefits=hard+err+opp;
 const retainer=retainerFor(c);
 const internal=1100;                      // team time during transition
 const totalCost=c.build+retainer*12+internal;
 const net=benefits-totalCost;
 const mb=benefits/12;
 let payback=null;
 if(mb>retainer)payback=Math.ceil((c.build+internal)/(mb-retainer));
 const roi=totalCost>0?net/totalCost:0;
 const verdict=(payback&&payback<=9)?'go':(payback&&payback<=18)?'review':'reshape';
 return{wage,hard,err,opp,benefits,retainer,internal,totalCost,net,mb,payback,roi,verdict,
  tier:tierFor(retainer,c.agents),
  cum:Array.from({length:12},(_,i)=>-(c.build+internal)+(i+1)*(mb-retainer))};
}

/* ---- rendering ---- */
function render(){renderSide();renderMain()}
function renderSide(){
 const el=$('#client-list');
 el.innerHTML=DB.clients.map(cl=>`<button class="client-item ${sel.client===cl.id?'on':''}" data-id="${cl.id}"><i></i>${esc(cl.name)}<span class="n">${cl.corridors.length}</span></button>`).join('')
  ||'<p class="hint" style="padding:8px">No clients yet — add one or load the demo data.</p>';
 $$('.client-item',el).forEach(b=>b.onclick=()=>{sel.client=b.dataset.id;sel.corr=null;render()});
}
function client(){return DB.clients.find(c=>c.id===sel.client)}
function corr(){const cl=client();return cl&&(cl.corridors.find(k=>k.id===sel.corr)||cl.corridors[0])}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function renderMain(){
 const cl=client(), m=$('#main');
 if(!cl){m.innerHTML=`<div class="empty"><h3>No client selected</h3><p>Create a client to start an audit, or load the demo data to see a worked example.</p><div style="margin-top:18px;display:flex;gap:10px;justify-content:center"><button class="btn primary" onclick="newClient()">+ New Client</button><button class="btn" onclick="seed()">Load Demo Data</button></div></div>`;return}
 const k=corr();if(k)sel.corr=k.id;
 m.innerHTML=`
 <div class="phead">
   <h2 style="font-size:1.35rem">${esc(cl.name)}</h2>
   <span class="chip">${esc(cl.industry||'—')}</span>
   <span class="spacer"></span>
   <button class="btn sm" onclick="renameClient()">Rename</button>
   <button class="btn sm danger" onclick="delClient()">Delete Client</button>
 </div>
 <div class="corr-tabs">
   ${cl.corridors.map(c=>`<button class="corr-tab ${c.id===sel.corr?'on':''}" data-id="${c.id}">${esc(c.name)}</button>`).join('')}
   <button class="corr-tab" data-id="__new">+ corridor</button>
 </div>
 ${k?corrHTML(k):'<div class="empty"><h3>No corridors</h3><p>Add the first workflow corridor to audit.</p></div>'}`;
 $$('.corr-tab',m).forEach(b=>b.onclick=()=>{
  if(b.dataset.id==='__new'){const name=prompt('Corridor name (e.g. "Quote → NetSuite")');if(!name)return;
   cl.corridors.push(blankCorr(name));sel.corr=cl.corridors[cl.corridors.length-1].id;save();render();return}
  sel.corr=b.dataset.id;render()});
 if(k)wireCorr(k);
}

function corrHTML(c){
 const r=calc(c);
 const V={go:['GO — STRONG CORRIDOR','go'],review:['REVIEW — MARGINAL, RE-SCOPE','review'],reshape:['RESHAPE — WRONG CORRIDOR','reshape']}[r.verdict];
 return `
 <div class="grid2">
  <div>
   <div class="panel">
    <div class="phead"><h3>Baseline · <span style="color:var(--ion)">${esc(c.name)}</span></h3><span class="spacer"></span>
     <button class="btn sm danger" onclick="delCorr()">Delete</button></div>
    <div class="field"><label>Corridor name</label><input data-f="name" value="${esc(c.name)}"></div>
    <div class="field"><label>Systems in corridor</label><input data-f="systems" value="${esc(c.systems)}" placeholder="Salesforce → NetSuite → Stripe"></div>
    <p class="klabel" style="margin:14px 0 8px">Roles doing the repetitive layer</p>
    <table id="roles-tbl"><thead><tr><th>Role</th><th class="r">Loaded $/hr</th><th class="r">Re-key hrs/wk</th><th></th></tr></thead>
    <tbody>${c.roles.map((ro,i)=>`<tr>
      <td><input data-role="${i}" data-rf="title" value="${esc(ro.title)}"></td>
      <td style="width:110px"><input type="number" min="0" data-role="${i}" data-rf="rate" value="${ro.rate}"></td>
      <td style="width:110px"><input type="number" min="0" data-role="${i}" data-rf="hrs" value="${ro.hrs}"></td>
      <td style="width:34px"><button class="btn sm danger" data-delrole="${i}" title="Remove role">✕</button></td></tr>`).join('')}
    </tbody></table>
    <button class="btn sm" id="add-role" style="margin-top:10px">+ Add role</button>
    <div class="grid3" style="margin-top:16px">
     <div class="field"><label>Task volume /wk</label><input type="number" min="0" data-f="volumeWk" value="${c.volumeWk}"></div>
     <div class="field"><label>Error incidents /yr</label><input type="number" min="0" data-f="errInc" value="${c.errInc}"></div>
     <div class="field"><label>Avg cost per incident</label><input type="number" min="0" data-f="errCost" value="${c.errCost}"></div>
     <div class="field"><label>Revenue lift est. /yr</label><input type="number" min="0" data-f="oppAnnual" value="${c.oppAnnual}"></div>
     <div class="field"><label>Turnaround today (days)</label><input type="number" min="0" data-f="turnDays" value="${c.turnDays}"></div>
    </div>
   </div>
   <div class="panel">
    <h3>Fleet plan</h3>
    <div class="grid3" style="margin-top:12px">
     <div class="field"><label>Agents</label><input type="number" min="1" max="24" data-f="agents" value="${c.agents}"></div>
     <div class="field"><label>Integrations</label><input type="number" min="1" max="10" data-f="ints" value="${c.ints}"></div>
     <div class="field"><label>Build fee (fixed quote)</label><input type="number" min="0" step="500" data-f="build" value="${c.build}"></div>
     <div class="field"><label>Retainer override ($0 = auto)</label><input type="number" min="0" step="50" data-f="retainerOverride" value="${c.retainerOverride}"></div>
    </div>
    <p class="hint">Auto retainer uses the standard formula (350 + agents×95 + tasks×0.35 + integrations×40, clamped $500–$3,400).</p>
   </div>
  </div>

  <div>
   <div class="panel">
    <div class="phead"><h3>ROI model</h3><span class="verdict ${V[1]}">◆ ${V[0]}</span></div>
    <div class="kpis">
     <div class="kpi good"><b>${r.payback?('M'+r.payback):'—'}</b><span>payback month</span></div>
     <div class="kpi"><b>${(r.roi*100).toFixed(0)}%</b><span>year-1 ROI</span></div>
     <div class="kpi gold"><b>${r.tier}</b><span>tier · ${fmt$(r.retainer)}/mo</span></div>
     <div class="kpi ${r.net>=0?'good':'warm'}"><b>${fmt$(r.net)}</b><span>net year 1</span></div>
    </div>
    <table>
     <thead><tr><th>Line</th><th>Basis</th><th class="r">Year 1</th></tr></thead>
     <tbody>
      <tr><td>Hard savings</td><td>${fmt$(r.wage)} wage cost × 80% credited</td><td class="r" style="color:var(--emerald)">+${fmt$(r.hard)}</td></tr>
      <tr><td>Error reduction</td><td>${c.errInc} incidents × ${fmt$(c.errCost)} × 60%</td><td class="r" style="color:var(--emerald)">+${fmt$(r.err)}</td></tr>
      <tr><td>Revenue lift</td><td>estimate × 50% discount</td><td class="r" style="color:var(--emerald)">+${fmt$(r.opp)}</td></tr>
      <tr><td>Build fee</td><td>fixed quote</td><td class="r" style="color:var(--coral)">−${fmt$(c.build)}</td></tr>
      <tr><td>Retainer</td><td>${fmt$(r.retainer)}/mo × 12</td><td class="r" style="color:var(--coral)">−${fmt$(r.retainer*12)}</td></tr>
      <tr><td>Internal time</td><td>audit + gate reviews</td><td class="r" style="color:var(--coral)">−${fmt$(r.internal)}</td></tr>
      <tr class="total"><td>Net year 1</td><td></td><td class="r">${fmt$(r.net)}</td></tr>
     </tbody>
    </table>
    <p class="bench">BENCHMARK: WELL-CHOSEN CORRIDORS MODEL AT PAYBACK M3–M9 · WALK-AWAY > M18</p>
   </div>
   <div class="panel">
    <div class="chart"><h5>Cumulative net position · months 1–12</h5>${cumChart(r)}</div>
    <div class="chart" style="margin-top:12px"><h5>Benefit composition (credited)</h5>${mixChart(r)}</div>
   </div>
   <div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <h3 style="flex:1">Blueprint</h3>
    <button class="btn gold" onclick="printBlueprint()">Print / PDF Blueprint →</button>
   </div>
  </div>
 </div>`;
}

function cumChart(r){
 const max=Math.max(...r.cum.map(Math.abs),1);
 const bars=r.cum.map((v,i)=>{
  const h=Math.max(2,Math.abs(v)/max*70), y=v>=0?76-h:78;
  const col=v>=0?'#34e3a4':'#ff6a3d';
  return `<rect x="${14+i*31}" y="${y}" width="20" height="${h}" rx="3" fill="${col}" opacity=".9"/>
   <text x="${24+i*31}" y="98" font-size="7.5" fill="#5d6b8f" text-anchor="middle" font-family="monospace">M${i+1}</text>`}).join('');
 return `<svg viewBox="0 0 400 102" style="width:100%"><line x1="10" y1="77" x2="392" y2="77" stroke="#22314f"/>${bars}</svg>`;
}
function mixChart(r){
 const total=r.benefits||1;
 const seg=[['HARD SAVINGS',r.hard,'#4fd8ff'],['ERROR CREDIT',r.err,'#8b7bff'],['REVENUE LIFT',r.opp,'#ffc24b']];
 let x=10;
 const bars=seg.map(([l,v,c])=>{const w=Math.max(1,v/total*380);const b=`<rect x="${x}" y="14" width="${w}" height="16" rx="3" fill="${c}" opacity=".9"/>`;x+=w;return b}).join('');
 const leg=seg.map(([l,v,c],i)=>`<text x="${10+i*135}" y="52" font-size="7.5" fill="${c}" font-family="monospace">■ ${l} ${fmt$(v)}</text>`).join('');
 return `<svg viewBox="0 0 400 60" style="width:100%">${bars}${leg}</svg>`;
}

/* ---- wiring ---- */
function wireCorr(c){
 $$('#main [data-f]').forEach(inp=>inp.addEventListener('change',()=>{
  const f=inp.dataset.f;
  c[f]=inp.type==='number'?+inp.value:inp.value;
  save();render();
 }));
 $$('#main [data-role]').forEach(inp=>inp.addEventListener('change',()=>{
  const i=+inp.dataset.role,f=inp.dataset.rf;
  c.roles[i][f]=inp.type==='number'?+inp.value:inp.value;
  save();render();
 }));
 $$('#main [data-delrole]').forEach(b=>b.onclick=()=>{c.roles.splice(+b.dataset.delrole,1);if(!c.roles.length)c.roles.push({title:'Role',rate:38,hrs:8});save();render()});
 const ar=$('#add-role');if(ar)ar.onclick=()=>{c.roles.push({title:'New role',rate:38,hrs:8});save();render()};
}

/* ---- client ops (global for inline handlers) ---- */
window.newClient=function(){const name=prompt('Client name');if(!name)return;
 const industry=prompt('Industry (e.g. B2B SaaS)')||'';
 DB.clients.push({id:uid(),name,industry,corridors:[blankCorr('Quote → ERP')]});
 sel.client=DB.clients[DB.clients.length-1].id;sel.corr=null;save();render()};
window.renameClient=function(){const cl=client();if(!cl)return;const n=prompt('Client name',cl.name);if(n){cl.name=n;save();render()}};
window.delClient=function(){const cl=client();if(!cl)return;if(!confirm('Delete "'+cl.name+'" and all its corridors?'))return;
 DB.clients=DB.clients.filter(x=>x.id!==cl.id);sel.client=DB.clients[0]?.id||null;sel.corr=null;save();render()};
window.delCorr=function(){const cl=client(),k=corr();if(!cl||!k)return;if(!confirm('Delete corridor "'+k.name+'"?'))return;
 cl.corridors=cl.corridors.filter(x=>x.id!==k.id);sel.corr=null;save();render()};
window.seed=function(){
 if(DB.clients.length&&!confirm('Demo data will be added alongside existing clients. Continue?'))return;
 DB.clients.push(
  {id:uid(),name:'Meridian Software',industry:'B2B SaaS · Series B',corridors:[
   Object.assign(blankCorr('Quote → NetSuite'),{systems:'Salesforce → CPQ sheet → NetSuite → Stripe',
    roles:[{title:'RevOps analyst',rate:38,hrs:22},{title:'Deal desk lead',rate:52,hrs:6}],
    volumeWk:420,errInc:8,errCost:3000,oppAnnual:18000,turnDays:4,agents:10,ints:3,build:18000}),
   Object.assign(blankCorr('Dunning & reconciliation'),{systems:'Stripe → NetSuite → email',
    roles:[{title:'AR admin',rate:34,hrs:14}],
    volumeWk:220,errInc:5,errCost:1800,oppAnnual:6000,turnDays:9,agents:4,ints:2,build:12000})]},
  {id:uid(),name:'Harbourline Group',industry:'Professional services',corridors:[
   Object.assign(blankCorr('Client onboarding'),{systems:'CRM → doc packs → practice mgmt',
    roles:[{title:'Practice admin',rate:36,hrs:11},{title:'Senior associate',rate:75,hrs:3}],
    volumeWk:90,errInc:4,errCost:2500,oppAnnual:24000,turnDays:12,agents:6,ints:2,build:15000})]});
 sel.client=DB.clients[DB.clients.length-2]?.id||DB.clients[0].id;sel.corr=null;save();render()};

/* ---- export / import ---- */
$('#btn-export').onclick=()=>{
 const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='df-audits-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
$('#btn-import').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.clients))throw 0;DB=d;sel={client:DB.clients[0]?.id||null,corr:null};save();render()}
  catch(err){alert('That file is not a valid Audit Cockpit export.')}})});
$('#btn-new-client').onclick=()=>newClient();
$('#btn-seed').onclick=()=>seed();
